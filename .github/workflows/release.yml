name: Build and release
on:
  push:
    branches: [main]
    paths: ['*.cs', 'build.ps1', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: |
          ./build.ps1
          New-Item -ItemType Directory -Force qa | Out-Null
          $exe = Get-Item EA_Search_1.0.4.exe
          $p = Start-Process $exe.FullName -ArgumentList '--test', "$pwd/qa" -Wait -PassThru -WindowStyle Hidden
          Get-Content qa/test-results.txt
          if ($p.ExitCode -ne 0) { throw 'Tests failed' }
          Compress-Archive -Path $exe.FullName,README_TH.txt,README.md,CHANGELOG.md -DestinationPath EA_Search_1.0.4_Portable.zip
      - name: Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.4 EA_Search_1.0.4_Portable.zip EA_Search_1.0.4.exe --target $env:GITHUB_SHA --title 'EA Column and Wall Search 1.0.4' --notes 'Adds Clear All for Members and Stories, including selections hidden by Find. Existing None remains visible-only. Edit > Clear All Selections clears both lists. Imported data and PT values are retained.'
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
